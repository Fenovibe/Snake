<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Snake</title>
<style>
  :root {
    --bg: #10141a;
    --panel: #1a2029;
    --cell: #1d242e;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --size: min(92vw, 480px, 68vh);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .hud { width: var(--size); display: flex; justify-content: space-between; font-size: 16px; }
  .hud span { color: var(--muted); }
  .board { position: relative; width: var(--size); aspect-ratio: 1; }
  canvas { width: 100%; height: 100%; display: block; border-radius: 10px; background: var(--panel); }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 16px; text-align: center;
    background: rgba(16, 20, 26, 0.78); border-radius: 10px;
  }
  .overlay.hidden { display: none; }
  .overlay h1 { margin: 0; font-size: 34px; }
  .overlay p { margin: 0; color: var(--muted); line-height: 1.4; }
  button {
    font: inherit; color: var(--text); background: var(--cell);
    border: 1px solid #2f3846; border-radius: 10px; padding: 10px 22px; cursor: pointer;
  }
  button:active { background: #2a3340; }
  .pad { display: none; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 56px); gap: 8px; }
  @media (pointer: coarse) { .pad { display: grid; } }
  .pad .up { grid-column: 2; }
  .pad .left { grid-column: 1; grid-row: 2; }
  .pad .down { grid-column: 2; grid-row: 2; }
  .pad .right { grid-column: 3; grid-row: 2; }
</style>
</head>
<body>
  <div class="hud">
    <div><span>Punkte</span> <b id="score">0</b></div>
    <div><span>Blätter</span> <b id="leaves">0/12</b></div>
    <div><span>Highscore</span> <b id="best">0</b></div>
  </div>

  <div class="board" id="board">
    <canvas id="c"></canvas>
    <div class="overlay" id="overlay">
      <h1 id="title">Raupe</h1>
      <p id="msg">Friss 12 Blätter, dann wird die Raupe zum Schmetterling.<br>
        Steuern mit Pfeiltasten, WASD oder Wischen.<br>Leertaste pausiert.</p>
      <button id="action">Start</button>
    </div>
  </div>

  <div class="pad">
    <button class="up" data-dir="0,-1">▲</button>
    <button class="left" data-dir="-1,0">◀</button>
    <button class="down" data-dir="0,1">▼</button>
    <button class="right" data-dir="1,0">▶</button>
  </div>

<script>
  const N = 20;                 // Spielfeld N × N Felder
  const START_MS = 140;         // Zeit pro Schritt am Anfang
  const MIN_MS = 60;            // schnellste Geschwindigkeit
  const SPEEDUP_MS = 2;         // pro gefressenem Blatt schneller
  const GROW = 12;              // so viele Blätter, bis sich die Raupe verpuppt

  // Verwandlung: Raupe verschwindet im Kokon, Kokon wackelt, Schmetterling fliegt los
  const FADE_MS = 700, WOBBLE_MS = 700, FLY_MS = 1400;
  const MORPH_MS = FADE_MS + WOBBLE_MS + FLY_MS;
  const WINGS = [
    ['#f472b6', '#c084fc'], ['#fb923c', '#facc15'], ['#60a5fa', '#a78bfa'],
    ['#f87171', '#fbbf24'], ['#34d399', '#22d3ee'],
  ];

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const leavesEl = document.getElementById('leaves');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('title');
  const msgEl = document.getElementById('msg');
  const actionBtn = document.getElementById('action');

  let snake, prev, dir, queue, food, score, leaves, stepMs, butterflies, morph;
  let state = 'ready';          // ready | running | paused | transform | next | over
  let acc = 0, last = 0;
  let best = 0;
  try { best = Number(localStorage.getItem('snake_best')) || 0; } catch {}

  function reset() {
    score = 0;
    stepMs = START_MS;
    butterflies = [];
    newCaterpillar();
  }

  function newCaterpillar() {
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    prev = snake.map(s => ({ ...s }));
    dir = { x: 1, y: 0 };
    queue = [];
    leaves = 0;
    acc = 0;
    placeFood();
    updateHud();
  }

  function placeFood() {
    const free = [];
    for (let y = 0; y < N; y++)
      for (let x = 0; x < N; x++)
        if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
    food = free[Math.floor(Math.random() * free.length)];
  }

  function updateHud() {
    scoreEl.textContent = score;
    leavesEl.textContent = `${leaves}/${GROW}`;
    bestEl.textContent = best;
  }

  function showOverlay(title, msg, label) {
    titleEl.textContent = title;
    msgEl.innerHTML = msg;
    actionBtn.textContent = label;
    overlay.classList.remove('hidden');
  }

  function start() {
    state = 'running';
    overlay.classList.add('hidden');
  }

  function pause() {
    state = 'paused';
    showOverlay('Pause', 'Leertaste oder Knopf zum Weiterspielen.', 'Weiter');
  }

  function gameOver() {
    state = 'over';
    acc = stepMs;
    const record = score > best;
    if (record) {
      best = score;
      try { localStorage.setItem('snake_best', best); } catch {}
      updateHud();
    }
    showOverlay(
      'Game over',
      `Punkte: ${score}<br>Schmetterlinge: ${butterflies.length}` +
        (record ? '<br>Neuer Highscore!' : ''),
      'Nochmals'
    );
  }

  function metamorphose() {
    state = 'transform';
    acc = stepMs;
    // Landeplatz auf einer freien Blume im Rand (Koordinaten inkl. Rand)
    let spot;
    do {
      const k = Math.floor(Math.random() * 4 * (N + 1));
      const side = Math.floor(k / (N + 1)), p = k % (N + 1);
      spot = [{ x: p, y: 0 }, { x: N + 1, y: p }, { x: N + 1 - p, y: N + 1 }, { x: 0, y: N + 1 - p }][side];
    } while (butterflies.length < 4 * (N + 1) &&
             butterflies.some(b => b.x === spot.x && b.y === spot.y));
    morph = {
      t0: performance.now(),
      x: snake[0].x, y: snake[0].y,
      tx: spot.x, ty: spot.y,
      wings: WINGS[butterflies.length % WINGS.length],
    };
  }

  function finishMorph() {
    butterflies.push({ x: morph.tx, y: morph.ty, wings: morph.wings, phase: Math.random() * 6 });
    state = 'next';
    showOverlay(
      'Verwandelt!',
      `Die Raupe ist zum Schmetterling geworden.<br>Schmetterlinge: ${butterflies.length}`,
      'Nächste Raupe'
    );
  }

  function action() {
    if (state === 'running') pause();
    else if (state === 'paused') start();
    else if (state === 'next') { newCaterpillar(); start(); }
    else if (state !== 'transform') { reset(); start(); }
  }

  // Richtungswechsel puffern, damit schnelle Doppeltipps nicht verloren gehen
  function turn(x, y) {
    if (state === 'ready') start();
    if (state === 'next') { newCaterpillar(); start(); }
    if (state !== 'running') return;
    const ref = queue.length ? queue[queue.length - 1] : dir;
    if (queue.length >= 2) return;
    if ((x === -ref.x && y === -ref.y) || (x === ref.x && y === ref.y)) return;
    queue.push({ x, y });
  }

  function step() {
    if (queue.length) dir = queue.shift();
    // Durch die Wand wie bei Snake II: auf der Gegenseite wieder herauskommen
    const head = {
      x: (snake[0].x + dir.x + N) % N,
      y: (snake[0].y + dir.y + N) % N,
    };
    const eating = head.x === food.x && head.y === food.y;
    const body = eating ? snake : snake.slice(0, -1);
    if (body.some(s => s.x === head.x && s.y === head.y)) return gameOver();
    prev = snake.map(s => ({ ...s }));
    snake.unshift(head);
    if (eating) {
      score++;
      leaves++;
      stepMs = Math.max(MIN_MS, stepMs - SPEEDUP_MS);
      updateHud();
      if (leaves >= GROW) return metamorphose();
      placeFood();
    } else {
      snake.pop();
    }
  }

  function circle(x, y, r) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Richtung von Feld a zu Feld b, auch wenn dazwischen der Rand liegt
  function delta(a, b) {
    let dx = b.x - a.x, dy = b.y - a.y;
    if (Math.abs(dx) > 1) dx = -Math.sign(dx);
    if (Math.abs(dy) > 1) dy = -Math.sign(dy);
    return { x: dx, y: dy };
  }

  // Blumenrand: eine Reihe Blumen rund um das Spielfeld, einmal vorgezeichnet
  let frame;
  const PETALS = ['#f472b6', '#c084fc', '#fbbf24', '#f9fafb', '#fb7185', '#60a5fa'];

  function drawFlower(f, x, y, c, color, rot) {
    f.fillStyle = color;
    for (let k = 0; k < 5; k++) {
      const a = rot + k * Math.PI * 2 / 5;
      f.beginPath();
      f.arc(x + Math.cos(a) * c * 0.2, y + Math.sin(a) * c * 0.2, c * 0.17, 0, Math.PI * 2);
      f.fill();
    }
    f.fillStyle = color === '#fbbf24' ? '#ea580c' : '#fde047';
    f.beginPath();
    f.arc(x, y, c * 0.12, 0, Math.PI * 2);
    f.fill();
  }

  function buildFrame() {
    frame = document.createElement('canvas');
    frame.width = frame.height = canvas.width;
    const f = frame.getContext('2d');
    const c = canvas.width / (N + 2);
    f.fillStyle = '#1f3a2a';
    f.fillRect(0, 0, frame.width, frame.height);
    f.clearRect(c, c, N * c, N * c);
    for (let y = 0; y < N + 2; y++)
      for (let x = 0; x < N + 2; x++) {
        if (x > 0 && y > 0 && x < N + 1 && y < N + 1) continue;
        drawFlower(f, (x + 0.5) * c, (y + 0.5) * c, c,
          PETALS[(x * 7 + y * 3) % PETALS.length], (x + y) * 0.6);
      }
  }

  function drawLeaf(x, y, c, now) {
    const s = c * (1 + Math.sin(now / 250) * 0.06);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(-0.6);
    ctx.fillStyle = '#16a34a';
    ctx.beginPath();
    ctx.moveTo(-s * 0.4, 0);
    ctx.quadraticCurveTo(0, -s * 0.45, s * 0.4, 0);
    ctx.quadraticCurveTo(0, s * 0.45, -s * 0.4, 0);
    ctx.fill();
    ctx.strokeStyle = '#bbf7d0';
    ctx.lineWidth = s * 0.05;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-s * 0.5, 0);
    ctx.lineTo(s * 0.3, 0);
    for (const k of [-0.15, 0.08]) {
      ctx.moveTo(s * k, 0);
      ctx.lineTo(s * (k + 0.12), -s * 0.13);
      ctx.moveTo(s * k, 0);
      ctx.lineTo(s * (k + 0.12), s * 0.13);
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawButterfly(x, y, s, flap, wings) {
    ctx.save();
    ctx.translate(x, y);
    ctx.save();
    ctx.scale(flap, 1);
    for (const side of [-1, 1]) {
      ctx.fillStyle = wings[0];
      ctx.beginPath();
      ctx.ellipse(side * s * 0.22, -s * 0.12, s * 0.24, s * 0.18, -side * 0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = wings[1];
      ctx.beginPath();
      ctx.ellipse(side * s * 0.16, s * 0.16, s * 0.16, s * 0.13, side * 0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      circle(side * s * 0.26, -s * 0.14, s * 0.05);
    }
    ctx.restore();
    ctx.fillStyle = '#1f2937';
    ctx.beginPath();
    ctx.ellipse(0, 0, s * 0.05, s * 0.24, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#1f2937';
    ctx.lineWidth = s * 0.03;
    ctx.beginPath();
    for (const side of [-1, 1]) {
      ctx.moveTo(0, -s * 0.2);
      ctx.lineTo(side * s * 0.12, -s * 0.38);
    }
    ctx.stroke();
    ctx.restore();
  }

  // Raupe zwischen zwei Schritten fliessend zeichnen (f = 0 … 1)
  function drawCaterpillar(c, f, now) {
    const segs = snake.map((s, i) => {
      const p = prev[i] || s;
      let d = delta(p, s);
      const x = (p.x + d.x * f + 0.5) * c, y = (p.y + d.y * f + 0.5) * c;
      if (!d.x && !d.y) d = i ? delta(s, snake[i - 1]) : dir;
      return { x, y, d };
    });

    // Neun Kopien, damit die Raupe beim Durchqueren des Rands auf beiden Seiten sichtbar ist
    const W = N * c;
    for (const ox of [-W, 0, W])
      for (const oy of [-W, 0, W]) {
        ctx.save();
        ctx.translate(ox, oy);

        for (let i = segs.length - 1; i > 0; i--) {
          const { x, y, d } = segs[i];
          const wiggle = Math.sin(now / 90 + i * 1.3) * c * 0.08;
          ctx.fillStyle = '#365314';
          for (const side of [-1, 1]) {
            circle(x + side * d.y * c * 0.42 + d.x * wiggle,
                   y + side * d.x * c * 0.42 + d.y * wiggle, c * 0.09);
          }
          ctx.fillStyle = i % 2 ? '#84cc16' : '#65a30d';
          circle(x, y, i === segs.length - 1 ? c * 0.38 : c * 0.47);
          ctx.fillStyle = '#facc15';
          circle(x, y, c * 0.08);
        }

        const { x: cx, y: cy, d } = segs[0];
        ctx.strokeStyle = '#3f6212';
        ctx.lineWidth = c * 0.07;
        ctx.lineCap = 'round';
        for (const side of [-1, 1]) {
          const tx = cx + d.x * c * 0.7 + side * d.y * c * 0.38;
          const ty = cy + d.y * c * 0.7 + side * d.x * c * 0.38;
          ctx.beginPath();
          ctx.moveTo(cx + d.x * c * 0.3 + side * d.y * c * 0.15,
                     cy + d.y * c * 0.3 + side * d.x * c * 0.15);
          ctx.lineTo(tx, ty);
          ctx.stroke();
          ctx.fillStyle = '#facc15';
          circle(tx, ty, c * 0.08);
        }
        ctx.fillStyle = '#a3e635';
        circle(cx, cy, c * 0.5);
        for (const side of [-1, 1]) {
          const ex = cx + d.x * c * 0.14 + side * d.y * c * 0.2;
          const ey = cy + d.y * c * 0.14 + side * d.x * c * 0.2;
          ctx.fillStyle = '#ffffff';
          circle(ex, ey, c * 0.13);
          ctx.fillStyle = '#10141a';
          circle(ex + d.x * c * 0.05, ey + d.y * c * 0.05, c * 0.065);
        }

        ctx.restore();
      }
  }

  function drawCocoon(c, t) {
    const scale = Math.min(t / FADE_MS, 1);
    const wobbling = t > FADE_MS && t < FADE_MS + WOBBLE_MS;
    const alpha = Math.max(0, 1 - Math.max(0, t - FADE_MS - WOBBLE_MS) / 300);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate((morph.x + 0.5) * c, (morph.y + 0.5) * c);
    ctx.rotate(wobbling ? Math.sin((t - FADE_MS) / 50) * 0.25 : 0);
    ctx.scale(scale, scale);
    ctx.fillStyle = '#a16207';
    ctx.beginPath();
    ctx.ellipse(0, 0, c * 0.3, c * 0.48, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#713f12';
    ctx.lineWidth = c * 0.05;
    ctx.beginPath();
    for (const k of [-0.2, 0, 0.2]) {
      ctx.moveTo(-c * 0.24, k * c);
      ctx.lineTo(c * 0.24, k * c);
    }
    ctx.stroke();
    ctx.restore();
  }

  // Flug vom Kokon zur Blume im Rand (Koordinaten inkl. Rand)
  function drawFlight(c, t) {
    if (t < FADE_MS + WOBBLE_MS) return;
    const p = Math.min((t - FADE_MS - WOBBLE_MS) / FLY_MS, 1);
    const e = 0.5 - 0.5 * Math.cos(Math.PI * p);
    const sx = morph.x + 1.5, sy = morph.y + 1.5;
    const tx = morph.tx + 0.5, ty = morph.ty + 0.5;
    const x = sx + (tx - sx) * e;
    const y = sy + (ty - sy) * e + Math.sin(p * Math.PI * 4) * 0.6 * (1 - p);
    drawButterfly(x * c, y * c, c * (0.5 + 0.4 * p), 0.3 + 0.7 * Math.abs(Math.sin(t / 70)), morph.wings);
  }

  function draw(now) {
    const c = canvas.width / (N + 2);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(frame, 0, 0);

    ctx.save();
    ctx.translate(c, c);
    ctx.beginPath();
    ctx.rect(0, 0, N * c, N * c);
    ctx.clip();

    ctx.fillStyle = '#1d242e';
    for (let y = 0; y < N; y++)
      for (let x = 0; x < N; x++)
        if ((x + y) % 2) ctx.fillRect(x * c, y * c, c, c);

    const f = Math.min(acc / stepMs, 1);
    if (state === 'transform') {
      const t = now - morph.t0;
      if (t < FADE_MS) {
        ctx.globalAlpha = 1 - t / FADE_MS;
        drawCaterpillar(c, f, now);
        ctx.globalAlpha = 1;
      }
      drawCocoon(c, t);
    } else if (state !== 'next') {
      drawLeaf((food.x + 0.5) * c, (food.y + 0.5) * c, c, now);
      drawCaterpillar(c, f, now);
    }
    ctx.restore();

    // Schmetterlinge sitzen auf dem Blumenrand und bewegen langsam die Flügel
    for (const b of butterflies)
      drawButterfly((b.x + 0.5) * c, (b.y + 0.5) * c, c * 0.9,
        0.7 + 0.3 * Math.sin(now / 350 + b.phase), b.wings);
    if (state === 'transform') drawFlight(c, now - morph.t0);
  }

  function loop(t) {
    if (state === 'running') {
      acc = Math.min(acc + (t - last), 500);
      while (acc >= stepMs && state === 'running') {
        acc -= stepMs;
        step();
      }
    }
    if (state === 'transform' && t - morph.t0 >= MORPH_MS) finishMorph();
    last = t;
    draw(t);
    requestAnimationFrame(loop);
  }

  function resize() {
    const size = Math.round(canvas.clientWidth * (window.devicePixelRatio || 1));
    canvas.width = canvas.height = size;
    buildFrame();
  }

  // Tastatur
  const KEYS = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
  };
  document.addEventListener('keydown', e => {
    const k = KEYS[e.key] || KEYS[e.key.toLowerCase()];
    if (k) { e.preventDefault(); turn(...k); }
    else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); action(); }
    else if ((e.key === 'p' || e.key === 'Escape') && state === 'running') pause();
  });

  // Wischen
  let touch = null;
  const board = document.getElementById('board');
  board.addEventListener('touchstart', e => {
    touch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  board.addEventListener('touchend', e => {
    if (!touch) return;
    const dx = e.changedTouches[0].clientX - touch.x;
    const dy = e.changedTouches[0].clientY - touch.y;
    touch = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0);
    else turn(0, Math.sign(dy));
  });

  // Steuerkreuz auf dem Handy
  document.querySelectorAll('.pad button').forEach(b => {
    b.addEventListener('pointerdown', e => {
      e.preventDefault();
      turn(...b.dataset.dir.split(',').map(Number));
    });
  });

  actionBtn.addEventListener('click', action);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'running') pause();
  });
  window.addEventListener('resize', resize);

  reset();
  resize();
  requestAnimationFrame(loop);
</script>
</body>
</html>
